# ============================================================================
# torgashka-network.conf — мережеві параметри PostgreSQL для сервера мережі
# магазинів (ЕТАП 0 «Мережева доступність сервера», гілка sync-offline)
# ============================================================================
# Як застосувати (drop-in для PostgreSQL 16, Debian/Ubuntu):
#   sudo cp deploy/network/postgresql.conf.d/torgashka-network.conf \
#       /etc/postgresql/16/main/conf.d/torgashka-network.conf
#   sudo chown postgres:postgres /etc/postgresql/16/main/conf.d/torgashka-network.conf
#   sudo chmod 644 /etc/postgresql/16/main/conf.d/torgashka-network.conf
#   sudo systemctl restart postgresql
#   sudo -u postgres psql -c "SHOW listen_addresses; SHOW ssl; SHOW port;"
#
# ⚠️ Перед рестартом ОБОВ'ЯЗКОВО замініть VPN_IP_placeholder на реальну
#    VPN-адресу сервера (напр. 100.64.0.3 для Tailscale або 10.147.17.5 для
#    ZeroTier). Значення '127.0.0.1' НЕ дозволить віддалені підключення —
#    це за замовчуванням і БЕЗПЕЧНО, але для мережі магазинів потрібен VPN-IP.
# ============================================================================

# --- Слухати ЛИШЕ на VPN-інтерфейсі (НЕ '*' і НЕ 0.0.0.0!) -----------------
# Принцип: PostgreSQL ніколи не дивиться в публічний інтернет. Доступ ззовні —
# виключно через VPN-тунель. Замініть плейсхолдер на реальний VPN-IP.
# Для локальних dev/тестів залиште 127.0.0.1 (цей файл тоді не копіюйте).
listen_addresses = 'VPN_IP_placeholder'

# --- Порт ----------------------------------------------------------------
# Стандартний порт PostgreSQL. Змінюйте ЛИШЕ якщо є вагома причина
# (напр. політика хостингу) — нестандартний порт ускладнює моніторинг.
port = 5432

# --- SSL (ОБОВ'ЯЗКОВО для віддаленого доступу) ---------------------------
# Віддалені клієнти зобов'язані йти через SSL (pg_hba: hostssl).
ssl = on

# Мінімальна версія TLS. TLSv1.2 — мінімум для сучасного PG16;
# TLSv1.3 — найкращий варіант, але вимагає підтримки клієнтами.
ssl_min_protocol_version = 'TLSv1.2'

# Сертифікат і ключ (Debian/Ubuntu PG16 — стандартні шляхи snakeoil).
# Для продакшена замініть на сертифікат від власного CA/Let's Encrypt і
# задайте ssl_ca_file, щоб клієнти могли перевіряти ланцюг.
# Приклад: ssl_ca_file = '/etc/postgresql/16/main/ca.crt'
ssl_cert_file = '/etc/ssl/certs/ssl-cert-snakeoil.pem'
ssl_key_file = '/etc/ssl/private/ssl-cert-snakeoil.key'

# --- Паролі: НЕ дозволяти підключення з порожнім паролем -----------------
password_encryption = 'scram-sha-256'

# --- Безпека з'єднань ------------------------------------------------------
# Час очікування автентифікації клієнта (сек). Захист від повільних/завислих
# TLS-хендшейків з інтернету.
authentication_timeout = 10s

# Максимум паралельних з'єднань. Для мережі магазинів (десятки кас) 100 —
# достатньо; пул фасаду + підключення адміністрування. За потреби збільште,
# але пам'ятайте: кожне з'єднання = процес = пам'ять.
max_connections = 100

# --- Журналювання (аудит для мережевого режиму) ---------------------------
# Логувати ВСІ завершені запити з помилками (повільні/збійні) —
# діагностика проблем магазинів через VPN.
log_min_duration_statement = 1000

# Логувати підключення/відключення — видно, хто і звідки заходить.
log_connections = on
log_disconnections = on

# Рівень логування для помилок автентифікації (спроби підбору паролів).
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'Europe/Kyiv'

# --- Додаткові рекомендації для сервера мережі -----------------------------
# Робоча пам'ять для сортувань/хешів. На VPS з 4 ГБ RAM орієнтовно 128MB;
# формула: ~25% RAM / max_connections. Для маленьких магазинних БД цього досить.
# work_mem = 128MB

# Спільний буфер. Орієнтовно 25% RAM VPS (на 4 ГБ → 1GB). Налаштуйте під хост.
# shared_buffers = 1GB

# Синхронний коміт: для мережі магазинів лишаємо on (максимальна надійність —
# кожна операція каси має бути зафіксована, а не втрачена при збої).
synchronous_commit = on

# ВАЖЛИВО: після зміни будь-якого параметра вище — перевірте валідність:
#   sudo -u postgres /usr/lib/postgresql/16/bin/postgres \
#       -D /var/lib/postgresql/16/main -C shared_buffers
#   sudo systemctl restart postgresql
#   sudo -u postgres psql -c "SELECT name, setting FROM pg_settings
#       WHERE name IN ('listen_addresses','ssl','port','password_encryption');"
# ============================================================================
