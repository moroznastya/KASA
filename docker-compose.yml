# ============================================================================
# Torgashka POS — Docker Compose
# ============================================================================
# Запуск:         docker compose up -d
# Зупинка:        docker compose down
# Тестова база:   docker compose up -d db-test
# ============================================================================
#
# 🔧 Оновлення 2026-08-01 (контейнеризація backend):
#     Backend (kasa-backend) тепер запускається в Docker!
#     - build: ./backend (multi-stage, python:3.12-slim)
#     - depends_on: db (condition: service_healthy)
#     - DATABASE_URL: postgresql+asyncpg://kasa:kasa@db:5432/kasa
#       (користувач kasa/БД kasa створюються init-скриптом при першому старті)
#     - healthcheck: /health через python urllib
#     - named volume pgdata для збереження даних PostgreSQL
#
#     ⚠️  hostname БД: `db` (service name у docker-мережі),
#         а НЕ `kasa-db` (container_name) — див. docker networks.
#
# 🔐  Безпека:
#     Всі секрети передаються через змінні оточення (обов'язкові, без дефолтів).
#     Перед запуском створіть .env файл:
#       cp .env.example .env   # потім заповніть значення
#     Обов'язкові змінні:
#       DB_PASSWORD — пароль PostgreSQL (без дефолту!)
#       SECRET_KEY  — секретний ключ застосунку (без дефолту!)
# ============================================================================

services:
  # ─── PostgreSQL 16 (основна БД) ───────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: kasa-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pos_system
      POSTGRES_USER: postgres
      # 🔐 Обов'язкова змінна оточення — без дефолтного пароля!
      # Пароль читається з .env (DB_PASSWORD) або середовища.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Створює користувача kasa та БД kasa (для backend DATABASE_URL).
      # Виконується тільки при першій ініціалізації (порожній pgdata).
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pos_system"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - kasa-network

  # ─── PostgreSQL 16 (тестова БД для CI/CD) ────────────────────────────────
  db-test:
    image: postgres:16-alpine
    container_name: kasa-db-test
    restart: unless-stopped
    environment:
      POSTGRES_DB: pos_system_test
      POSTGRES_USER: postgres
      # Тестова БД — використовує окрему змінну з дефолтом для CI.
      # У production-оточенні задайте DB_TEST_PASSWORD явно.
      POSTGRES_PASSWORD: ${DB_TEST_PASSWORD:-test_password}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pos_system_test"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - kasa-network
    profiles:
      - test
      - ci

  # ─── Backend (FastAPI) — ⚠️ LEGACY (етап 8: Python sidecar дезактивовано) ─
  # Rust-ядро kasa-api слухає :8000 (Tauri/фасад) — healthcheck нижче
  # перевіряє його /api/v1/health. Сервіс не запускається за замовчуванням
  # (profiles: legacy) і збережений лише для відкату/налагодження.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kasa-backend
    restart: unless-stopped
    profiles: ["legacy"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Прямий DSN (override) — пріоритет над DB_* компонентами.
      # 🔧 Для dev-середовища: kasa/kasa (створюється init-скриптом).
      #    Для production — задайте надійні облікові дані та змініть скрипт!
      DATABASE_URL: postgresql+asyncpg://kasa:kasa@db:5432/kasa
      # Компоненти БД (fallback + сумісність з іншими частинами коду)
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: kasa
      DB_PASSWORD: kasa
      DB_NAME: kasa
      # 🔐 Обов'язкові змінні оточення — без дефолтного пароля!
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      APP_NAME: "Torgashka POS"
      DEBUG: "False"
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173,http://127.0.0.1:8000,http://localhost:8000"
    ports:
      - "8001:8001"
    healthcheck:
      # Rust-ядро :8000 (Python sidecar дезактивовано, етап 8)
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - kasa-network

volumes:
  pgdata:
    driver: local

networks:
  kasa-network:
    driver: bridge
