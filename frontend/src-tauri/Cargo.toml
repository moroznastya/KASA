[workspace.lints.clippy]
result_large_err = "allow"  # tonic::Status — gRPC-тип (rustc 1.98 lint)

[workspace]
members = ["crates/*"]
resolver = "2"

[package]
name = "torgashka"
version = "1.0.0"
description = "Torgashka — Enterprise POS-система для малого та середнього бізнесу"
authors = ["Torgashka Team"]
edition = "2021"

[lib]
name = "torgashka_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = ["tray-icon", "custom-protocol", "wry", "common-controls-v6", "dynamic-acl", "x11", "dbus"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-global-shortcut = "2"
# ── Автозапуск: POS стартує разом із системою ────────────────────────────
# На Linux створює ~/.config/autostart/*.desktop, на Windows — запис у реєстрі,
# на macOS — LaunchAgent (~/Library/LaunchAgents).
tauri-plugin-autostart = "2"
# ── Single-instance: захист від подвійного запуску каси на одній машині ──
tauri-plugin-single-instance = "2"
# ── Автооновлення (updater): перевірка/завантаження/встановлення оновлень ──
tauri-plugin-updater = "2"
serde_json = "1"
dirs-next = "2"
# ── Крейт інфраструктури: апаратні інтеграції, друк, офлайн-БД ───────────
torgashka-infrastructure = { path = "crates/torgashka-infrastructure" }
torgashka-api = { path = "crates/torgashka-api" }
torgashka-prro = { path = "crates/torgashka-prro" }
# ── SIGTERM для graceful shutdown фасаду (Unix) ─────────────────────────
tokio = { version = "1", features = ["rt", "signal", "net"] }

# ── Профілі збірки ────────────────────────────────────────────────────────
# Повний debuginfo у debug-профілі роздуває бінарники до 300-400 МБ кожен
# і накопичує 30+ ГБ у target/debug/deps. line-tables-only дає трасування
# (backtraces з номерами рядків) без роздування. Strip у release прибирає
# символи — менші бінарники для дистрибуції.
[profile.dev]
debug = "line-tables-only"

[profile.release]
strip = true
