[workspace]
members = ["crates/*"]
resolver = "2"

[package]
name = "kasa-pos"
version = "1.0.0"
description = "Kasa POS — Enterprise POS-система для малого та середнього бізнесу"
authors = ["Kasa Team"]
edition = "2021"

[lib]
name = "kasa_pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-global-shortcut = "2"
# ── Автозапуск: POS стартує разом із системою ────────────────────────────
# На Linux створює ~/.config/autostart/*.desktop, на Windows — запис у реєстрі,
# на macOS — LaunchAgent (~/Library/LaunchAgents).
tauri-plugin-autostart = "2"
# ── Single-instance: захист від подвійного запуску каси на одній машині ──
tauri-plugin-single-instance = "2"
# ── Автооновлення (updater): перевірка/завантаження/встановлення оновлень ──
tauri-plugin-updater = "2"
serde_json = "1"
dirs-next = "2"
# ── Крейт інфраструктури: апаратні інтеграції, друк, офлайн-БД ───────────
kasa-infrastructure = { path = "crates/kasa-infrastructure" }
