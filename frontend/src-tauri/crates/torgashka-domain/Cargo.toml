[package]
name = "torgashka-domain"
version = "0.1.0"
edition = "2021"
description = "Torgashka — Domain layer: чисті сутності, value objects, доменні події, репозиторії (trait). Без залежностей від Tauri/інфраструктури."


[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = "1"
bigdecimal = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde"] }
thiserror = "2"
async-trait = "0.1"
serde_json = "1.0.151"
