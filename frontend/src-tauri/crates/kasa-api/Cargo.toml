[package]
name = "kasa-api"
version = "0.1.0"
edition = "2021"
description = "Kasa POS — вбудований axum-фасад: HTTP gateway, reverse proxy → Python sidecar, JWT-валідація"

[dependencies]
axum = { version = "0.7", features = ["macros", "multipart"] }
kasa-domain = { path = "../kasa-domain" }
kasa-application = { path = "../kasa-application" }
kasa-infrastructure = { path = "../kasa-infrastructure" }
kasa-prro = { path = "../kasa-prro" }
kasa-ocr = { path = "../kasa-ocr" }
uuid = { version = "1", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid"] }
rust_xlsxwriter = "0.97.1"
tower-http = { version = "0.6", features = ["cors"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
