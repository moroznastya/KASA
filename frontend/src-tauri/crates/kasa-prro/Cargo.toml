[package]
name = "kasa-prro"
version = "0.1.0"
edition = "2021"
description = "Kasa POS — ПРРО (фіскалізація через ДПС України): gRPC-клієнт ChkIncomeService (tonic), XML СЗЗД 2.1.7 (канонізація C14N, MAC), key_store (JKS/PKCS#12/PEM), крипто-шар (FFI до IIT SDK EUSignCP для ДСТУ 4145 + чистий Rust для RSA/ECDSA). Етап 7 міграції."

[dependencies]
tonic = { version = "0.12", features = ["tls", "tls-roots"] }
prost = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
base64 = "0.22"
sha2 = "0.10"
sha1 = "0.10"
thiserror = "2"
libloading = "0.8"
x509-parser = "0.16"
pem = "3"
md-5 = "0.10"
des = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
hex = "0.4"
rustls-pki-types = "1"
rust_decimal = "1"
chrono = "0.4"
tracing = "0.1"
# PKCS#12 — через openssl (системний OpenSSL 3.x)
openssl = "0.10"
# Для авто-визначення алгоритму приватного ключа (RSA/EC/ДСТУ)
pkcs8 = { version = "0.10", features = ["pem"] }

[build-dependencies]
tonic-build = "0.12"
prost-build = "0.13"
protoc-bin-vendored = "3"

[dev-dependencies]
