[package]
name = "torgashka-api"
version = "0.1.0"
edition = "2021"
description = "Torgashka — вбудований axum-фасад: HTTP gateway, reverse proxy → Python sidecar, JWT-валідація"


[lints]
workspace = true

[dependencies]
axum = { version = "0.7", features = ["macros", "multipart"] }
torgashka-domain = { path = "../torgashka-domain" }
torgashka-application = { path = "../torgashka-application" }
torgashka-infrastructure = { path = "../torgashka-infrastructure" }
torgashka-prro = { path = "../torgashka-prro" }
torgashka-ocr = { path = "../torgashka-ocr" }
uuid = { version = "1", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid"] }
bigdecimal = "0.4"
rust_xlsxwriter = "0.97.1"
tower-http = { version = "0.6", features = ["cors"] }
sha2 = "0.10"

[dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
async-trait = "0.1.92"
