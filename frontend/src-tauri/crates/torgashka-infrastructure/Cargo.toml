[package]
name = "torgashka-infrastructure"
version = "0.1.0"
edition = "2021"
description = "Torgashka — Infrastructure layer: реалізації портів (devices, print, terminal, cash_drawer, offline). Перенесено з монолітного Tauri-пакета (етап 0, Strangler Fig)."


[lints]
workspace = true

[dependencies]
# ⚠️ Тимчасово: команди з #[tauri::command] перенесені разом із логікою.
# Розщеплення (тонкі команди в shell, чиста логіка тут) — наступні етапи.
tauri = { version = "2", default-features = false, features = ["custom-protocol", "wry", "common-controls-v6", "dynamic-acl", "x11", "dbus"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
dirs-next = "2"
serialport = { version = "4", default-features = false }
image = "0.25"
thiserror = "2"
tempfile = "3"
base64 = "0.22"
libc = "0.2"
# ── Read-довідники (етап 1): sqlx-пул PostgreSQL, тільки читання ──────
rust_decimal = "1"
bigdecimal = "0.4"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid", "rust_decimal", "bigdecimal"] }
torgashka-domain = { path = "../torgashka-domain" }
torgashka-prro = { path = "../torgashka-prro" }
torgashka-ocr = { path = "../torgashka-ocr" }
async-trait = "0.1"
bcrypt = "0.19.3"
regex = "1.13.1"
tokio = { version = "1", features = ["process", "time", "macros", "rt"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
qrcode = { version = "0.14.1", default-features = false }
barcoders = "2.0.0"
futures-util = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "process"] }
