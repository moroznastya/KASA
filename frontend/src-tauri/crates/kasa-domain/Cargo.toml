[package]
name = "kasa-domain"
version = "0.1.0"
edition = "2021"
description = "Kasa POS — Domain layer: чисті сутності, value objects, доменні події, репозиторії (trait). Без залежностей від Tauri/інфраструктури."

[dependencies]
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = "1"
thiserror = "2"
