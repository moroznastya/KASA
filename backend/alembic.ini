# Конфігурація Alembic для міграцій бази даних Torgashka
# Документація: https://alembic.sqlalchemy.org/

[alembic]
# Шлях до директорії з міграціями
script_location = alembic

# URL бази даних (заповнюється з env.py через config)
# sqlalchemy.url = driver://user:pass@localhost/dbname

# Формат імені файлу міграції
file_template = %%(rev)s_%%(slug)s

# Час у мітках для міграцій
timezone = UTC

# Логування SQL-запитів під час міграцій
sqlalchemy.echo = false

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
