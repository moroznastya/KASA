[pytest]
# ── Налаштування pytest для Torgashka ────────────────────────────────────────

# Тестова директорія
testpaths = tests

# Патерни для пошуку тестів
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Плагіни
asyncio_mode = auto

# Позначки (маркери)
markers =
    integration: Інтеграційні тести (потребують БД)
    slow: Повільні тести
    auth: Тести авторизації
    sale: Тести продажу
    invoice: Тести накладних
    ledger: Тести взаєморозрахунків
    v2: Тести API v2
    products: Тести товарів
    categories: Тести категорій
    receipts: Тести чеків
    prro: Тести ПРРО / офлайн-черги
    rate_limit: Тести rate-limit

# Параметри за замовчуванням
addopts =
    -v
    --tb=short
    --strict-markers
    --asyncio-mode=auto

# Фільтрація попереджень
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
