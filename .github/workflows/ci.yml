# ============================================================================
# Kasa POS — CI Pipeline
# ============================================================================
# Запускається при push/PR в main, develop, feature/* гілки.
# ============================================================================
# Jobs:
#   lint-backend   — ruff + mypy
#   lint-frontend  — eslint + tsc --noEmit
#   test-backend   — pytest (unit + integration)
#   build          — Docker build перевірка
# ============================================================================

name: 🧪 Kasa POS — CI

on:
  push:
    branches: [main, develop, feature/*]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  REGISTRY: ghcr.io

defaults:
  run:
    working-directory: ./kasa

jobs:
  # ─── Backend Lint — ruff + mypy ─────────────────────────────────────────
  lint-backend:
    name: 🔍 Backend lint (ruff + mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./kasa/backend

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            kasa/backend/requirements.txt
            kasa/backend/requirements-dev.txt

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: 🔬 Ruff check
        run: ruff check app/ --output-format=github

      - name: 🔬 Mypy check
        run: mypy app/ --ignore-missing-imports
        continue-on-error: true  # mypy — рекомендаційний

  # ─── Frontend Lint — eslint + tsc ───────────────────────────────────────
  lint-frontend:
    name: 🔍 Frontend lint (eslint + tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./kasa/frontend

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚡ Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: kasa/frontend/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔬 ESLint check
        run: npm run lint

      - name: 🔬 TypeScript check
        run: npx tsc --noEmit

  # ─── Backend Test — pytest ──────────────────────────────────────────────
  test-backend:
    name: 🧪 Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./kasa/backend

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            kasa/backend/requirements.txt
            kasa/backend/requirements-dev.txt

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: 🧪 Unit tests
        run: pytest tests/unit/ -v --tb=short

      - name: 🧪 Integration tests
        run: pytest tests/integration/ -v --tb=short -m integration

      - name: 📊 Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: kasa/backend/htmlcov/
          retention-days: 7

  # ─── Build — Docker ─────────────────────────────────────────────────────
  build:
    name: 🐳 Docker build check
    runs-on: ubuntu-latest
    needs: [lint-backend, lint-frontend, test-backend]

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐳 Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./kasa/backend
          push: false
          tags: kasa-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🐳 Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./kasa/frontend
          push: false
          tags: kasa-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Summary ────────────────────────────────────────────────────────────
  summary:
    name: 📋 CI Summary
    runs-on: ubuntu-latest
    needs: [lint-backend, lint-frontend, test-backend, build]
    if: always()

    steps:
      - name: 📊 Generate summary
        run: |
          echo "## ✅ Kasa POS — CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔍 Backend lint | ${{ needs.lint-backend.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔍 Frontend lint | ${{ needs.lint-frontend.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 Backend tests | ${{ needs.test-backend.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐳 Docker build | ${{ needs.build.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
