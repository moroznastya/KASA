# ============================================================================
# Torgashka POS — Rust Core CI (етап 0.4 міграції Torgashka → Rust)
# ============================================================================
# Стратегія: docs/RUST_MIGRATION_PLAN.md §6 (CI)
#   rust-core: cargo fmt --check → cargo clippy -D warnings → cargo test
# Запускається при push/PR у main та feat/rust-migration.
# Робоча директорія: frontend/src-tauri (workspace: crates/torgashka-* + Tauri shell).
# sqlx: НЕ використовується на етапі 0 — крок sqlx prepare не потрібен.
#
# 🔧 ФІКС 2026-08-27:
#   1. `--workspace` додано до clippy/test — без нього Cargo тестує ЛИШЕ
#      root-package (Tauri shell, 0 тестів), а тести crates/* пропускаються.
#   2. Додано PostgreSQL 16 сервіс: інтеграційні тести (pos_crud, ledger_crud,
#      cash_operations, store_settings_isolation та ін.) потребують живої БД.
#      Схема + seed — scripts/schema.sql (комітиться; лише DDL + фікстури,
#      без персональних даних).
#   3. readdirs_snapshot позначено #[ignore] — потребує даних робочої БД
#      nastya (порівняння з Python-еталоном); CI запускає його лише з --ignored.
#   4. Додано системні залежності Tauri (libwebkit2gtk-4.1, libgtk-3, ...):
#      clippy/test збирають root-package (Tauri shell) — без glib/webkit
#      збірка падає з "PKG_CONFIG_PATH not set".
#   5. Додано frontend build перед clippy: tauri::generate_context!() вимагає
#      frontendDist (../dist) — без зібраного frontend proc macro падає.
# ============================================================================

name: 🦀 Rust Core — workspace

on:
  push:
    branches: [main, feat/rust-migration]
  pull_request:
    branches: [main, feat/rust-migration]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:test_password@localhost:5432/pos_system
  TEST_DATABASE_URL: postgresql://postgres:test_password@localhost:5432/pos_system_test
  TORGASHKA_JWT_SECRET: ci-test-secret-key-2026-32chars-minimum!!

defaults:
  run:
    working-directory: frontend/src-tauri

jobs:
  rust-core:
    name: fmt → clippy → test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pos_system
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pos_system"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🦀 Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 💾 Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      # ─── Системні бібліотеки (Tauri: glib, webkit2gtk...) ──────────────
      - name: 📦 Install system deps (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      # ─── Frontend build (tauri::generate_context! вимагає ../dist) ─────
      - name: ⚡ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 🧱 Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # ─── PostgreSQL: тестова БД + схема/seed ──────────────────────────
      - name: 🗄️ Create test DB
        run: |
          PGPASSWORD=test_password psql -h localhost -U postgres -d pos_system \
            -c "CREATE DATABASE pos_system_test;" || true

      - name: 🗄️ Apply schema + seed (pos_system)
        run: |
          PGPASSWORD=test_password psql -h localhost -U postgres -d pos_system \
            -v ON_ERROR_STOP=1 -f ../../scripts/schema.sql

      - name: 🗄️ Apply schema + seed (pos_system_test)
        run: |
          PGPASSWORD=test_password psql -h localhost -U postgres -d pos_system_test \
            -v ON_ERROR_STOP=1 -f ../../scripts/schema.sql

      - name: ✨ cargo fmt --check
        run: cargo fmt --check

      - name: 🧹 cargo clippy (warnings = errors)
        run: cargo clippy --workspace -- -D warnings

      - name: 🧪 cargo test
        run: cargo test --workspace
