# ============================================================================
# Torgashka — Windows release build (NSIS .exe + WiX .msi + updater artifacts)
# Стратегія: docs/windows-build-plan.md §2
# Тригер: ручний (workflow_dispatch) або tag v*.*.*
#
# ⚠️ ФІКС 2026-08-21 (аномалія: latest.json відсутній):
#   tauri-cli (>=2.5) НЕ генерує latest.json при `tauri build` — лише .sig.
#   latest.json генерує tauri-apps/tauri-action (updaterJsonGlob).
#   → крок "Tauri build" замінено з npm run tauri:build на tauri-action.
#   → крок softprops/action-gh-release прибрано: tauri-action створює
#     GitHub Release на тезі v*.*.* сам (з latest.json у складі ассетів).
# ============================================================================
name: 🪟 Windows Build (NSIS + MSI)

on:
  workflow_dispatch:        # ручний запуск
  push:
    tags: ['v*.*.*']        # автоматично при пуші тегу релізу
    branches: ['main', 'feat/rust-migration']   # main — основний; feat/rust-migration — тимчасово для валідації

permissions:
  contents: write           # потрібно для upload до GitHub Release

jobs:
  build-windows:
    name: Build NSIS + MSI
    runs-on: windows-latest
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    defaults:
      run:
        working-directory: frontend          # всі npm/tauri команди — з frontend/

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 🦀 Setup Rust (MSVC toolchain)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 💾 Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: 📦 npm ci
        run: npm ci

      - name: 🧱 Build frontend
        run: npm run build

      - name: 🔐 Install OpenSSL (vcpkg, для torgashka-prro PKCS#12)
        shell: pwsh
        run: |
          vcpkg install openssl:x64-windows-static-md
          "OPENSSL_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md" | Out-File -Append -FilePath $env:GITHUB_ENV

      # ── Tauri build через tauri-action ─────────────────────────────────
      # tauri-action: збирає (npm run tauri build), підписує (.sig),
      # ГЕНЕРУЄ latest.json (updaterJsonGlob) і на тезі v*.*.* створює
      # GitHub Release. На гілці без тега (tagName порожній) — тільки
      # збірка + latest.json (URL → releases/latest/download/...).
      - name: 🏗️ Tauri build (NSIS + MSI + updater)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --bundles nsis,msi
          updaterJsonGlob: '**/*.sig'
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: Torgashka ${{ github.ref_name }}
          releaseDraft: true

      - name: 📤 Upload artifacts (installers + updater)
        uses: actions/upload-artifact@v4
        with:
          name: torgashka-windows
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/msi/*.msi
            frontend/src-tauri/target/release/bundle/nsis/*.sig
            frontend/src-tauri/target/release/bundle/msi/*.sig
            frontend/src-tauri/target/release/bundle/nsis/latest.json
            frontend/src-tauri/target/release/bundle/msi/latest.json
          if-no-files-found: error
